name: Windows acceptance and packaging
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run test:startup
      - run: npm run test:browser
      - run: npm run test:timed
      - run: npm run chaos -- 100 314159
      - run: npm run package:installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: GHOST-windows-x64
          path: |
            release/*.exe
            release/*.blockmap
            test-results/*.json
      # Native foreground-window acceptance must also be run interactively on Windows.
      # Hosted CI desktops do not provide a reliable human foreground-input session.
